services:
  # 🚀 Backend Web Service no Render
  - type: web
    name: prepuni-backend
    env: node
    plan: free
    region: frankfurt
    rootDir: Quizunda-main
    buildCommand: npm install
    startCommand: node src/backend/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGIN
        value: "*"
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: prepuni-db
          property: connectionString

databases:
  # 🗄️ Banco de Dados PostgreSQL no Render (Opcional - caso queira criar no Render)
  - name: prepuni-db
    databaseName: prepUni_db
    user: postgres
    plan: free
    region: frankfurt

